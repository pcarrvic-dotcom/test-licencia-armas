<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Licencia de Armas Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --verde: #1b5e20; --bg: #f0f2f5; --rojo: #d32f2f; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .card { background: white; max-width: 500px; width: 100%; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: var(--verde); text-align: center; border-bottom: 2px solid var(--verde); padding-bottom: 10px; font-size: 1.2rem; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .opcion { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; background: white; text-align: left; cursor: pointer; font-size: 0.95rem; width: 100%; }
        .correcta { background: #c8e6c9 !important; border-color: #4caf50 !important; color: #1b5e20; font-weight: bold; }
        .incorrecta { background: #ffcdd2 !important; border-color: #f44336 !important; color: #b71c1c; }
        .btn { background: var(--verde); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 5px; }
        .btn-rojo { background: var(--rojo); }
        .btn-tema { background: #eceff1; color: #455a64; border: 1px solid #cfd8dc; }
        .hidden { display: none; }
        .header-test { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; font-weight: bold; margin-bottom: 10px; }
        .fallo-item { background: #fff5f5; border-left: 4px solid var(--rojo); padding: 10px; margin-bottom: 10px; text-align: left; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="card">
    <h1 id="titulo-principal">🦅 LICENCIA DE ARMAS ESPAÑA 🦅</h1>
    
    <!-- MENU INICIAL -->
    <div id="pantalla-carga">
        <p id="estado" style="text-align:center">Cargando base de datos...</p>
        <div id="menu-temas" class="hidden">
            <button class="btn btn-rojo" onclick="iniciarModo('examen')">⚖️ EXAMEN OFICIAL (MIXTO)</button>
            <button id="btn-reintentar-fallos" class="btn hidden" style="background:#fb8c00" onclick="iniciarModo('reintento-fallos')">🔄 REPETIR SOLO FALLADAS</button>
            <p style="text-align:center; font-size: 0.8rem; font-weight: bold; color: #666; margin: 10px 0;">ESTUDIAR POR TEMAS:</p>
            <div id="grid-botones" class="menu-grid"></div>
        </div>
    </div>

    <!-- PANTALLA TEST -->
    <div id="pantalla-test" class="hidden">
        <div class="header-test">
            <span id="info-modo"></span>
            <span id="info-progreso"></span>
        </div>
        <p id="pregunta" style="font-weight: bold; font-size: 1rem; line-height: 1.4; color: #222;"></p>
        <div id="opciones"></div>
        <button id="btn-next" class="btn hidden" style="margin-top:10px" onclick="siguiente()">SIGUIENTE PREGUNTA</button>
    </div>

    <!-- PANTALLA FINAL -->
    <div id="pantalla-final" class="hidden" style="text-align: center;">
        <h2 id="nota" style="font-size: 3rem; margin: 0;"></h2>
        <p id="texto-final" style="font-size: 1.5rem; font-weight: bold;"></p>
        <hr>
        <button id="btn-ver-fallos" class="btn btn-tema hidden" onclick="toggleFallos()">Ver mis fallos (<span id="count-fallos">0</span>)</button>
        <div id="lista-fallos" class="hidden" style="max-height: 300px; overflow-y: auto; margin: 15px 0;"></div>
        <button class="btn" onclick="volverMenu()">VOLVER AL MENÚ</button>
    </div>
</div>

<script>
    let bancoTotal = [];
    let preguntasSesion = [];
    let fallosAcumulados = []; // Aquí guardamos las preguntas falladas
    let indice = 0;
    let aciertos = 0;

    window.onload = function() {
        Papa.parse("datos.csv", {
            download: true,
            header: false,
            skipEmptyLines: true,
            encoding: "ISO-8859-1",
            complete: function(res) {
                const filas = res.data.slice(1);
                let ultimoTema = "1";

                bancoTotal = filas.map(f => {
                    let t = f[1] ? f[1].toString().trim() : "";
                    if (t !== "") ultimoTema = t;
                    return {
                        tema: ultimoTema,
                        p: f[2] ? f[2].trim() : "",
                        a: f[3] ? f[3].trim() : "",
                        b: f[4] ? f[4].trim() : "",
                        c: f[5] ? f[5].trim() : "",
                        r: f[6] ? f[6].trim().toUpperCase().replace(/[\)\.]/g, "") : ""
                    };
                }).filter(f => f.p.length > 5);

                generarMenu();
            }
        });
    };

    function generarMenu() {
        document.getElementById('estado').classList.add('hidden');
        document.getElementById('menu-temas').classList.remove('hidden');
        const grid = document.getElementById('grid-botones');
        grid.innerHTML = "";

        // Mostrar botón de reintento si hay fallos
        if(fallosAcumulados.length > 0) {
            const btnFallos = document.getElementById('btn-reintentar-fallos');
            btnFallos.classList.remove('hidden');
            btnFallos.innerText = `🔄 REPETIR SOLO FALLADAS (${fallosAcumulados.length})`;
        }

        const temasUnicos = [...new Set(bancoTotal.map(q => q.tema))].sort((a,b) => a-b);
        temasUnicos.forEach(tema => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-tema';
            btn.innerText = `Tema ${tema}`;
            btn.onclick = () => iniciarModo('tema', tema);
            grid.appendChild(btn);
        });
    }

    function iniciarModo(modo, valor) {
        indice = 0;
        aciertos = 0;
        let fallosEnEstaSesion = []; // Limpiamos para el nuevo test

        if (modo === 'tema') {
            document.getElementById('info-modo').innerText = "TEMA " + valor;
            preguntasSesion = bancoTotal.filter(q => q.tema == valor).sort(() => 0.5 - Math.random());
        } else if (modo === 'examen') {
            document.getElementById('info-modo').innerText = "EXAMEN OFICIAL";
            preguntasSesion = generarExamenOficial();
        } else if (modo === 'reintento-fallos') {
            document.getElementById('info-modo').innerText = "REPASO DE FALLOS";
            preguntasSesion = [...fallosAcumulados].sort(() => 0.5 - Math.random());
            fallosAcumulados = []; // Los vaciamos para volver a "evaluarlos"
        }

        document.getElementById('pantalla-carga').classList.add('hidden');
        document.getElementById('pantalla-test').classList.remove('hidden');
        mostrar();
    }

    function generarExamenOficial() {
        let examen = [];
        const temas = [...new Set(bancoTotal.map(q => q.tema))];
        temas.forEach(t => {
            let cant = (t <= 5) ? 3 : 2; 
            let deTema = bancoTotal.filter(q => q.tema == t).sort(() => 0.5 - Math.random()).slice(0, cant);
            examen.push(...deTema);
        });
        while(examen.length < 20) {
            let azar = bancoTotal[Math.floor(Math.random()*bancoTotal.length)];
            if(!examen.includes(azar)) examen.push(azar);
        }
        return examen.slice(0, 20).sort(() => 0.5 - Math.random());
    }

    function mostrar() {
        let q = preguntasSesion[indice];
        document.getElementById('info-progreso').innerText = (indice + 1) + " / " + preguntasSesion.length;
        document.getElementById('pregunta').innerText = q.p;
        document.getElementById('btn-next').classList.add('hidden');
        
        const limpiar = (t) => t.replace(/^[A-C][\)\.\-\s]{1,2}/i, "");
        let html = "";
        [['A', q.a], ['B', q.b], ['C', q.c]].forEach(([letra, texto]) => {
            html += `<button class="opcion" onclick="validar(this, '${letra}', '${q.r}')">${letra}) ${limpiar(texto)}</button>`;
        });
        document.getElementById('opciones').innerHTML = html;
    }

    function validar(btn, elegida, correcta) {
        let q = preguntasSesion[indice];
        let buttons = document.querySelectorAll('.opcion');
        buttons.forEach(b => b.disabled = true);
        
        if(elegida === correcta) {
            btn.classList.add('correcta');
            aciertos++;
        } else {
            btn.classList.add('incorrecta');
            // Guardar en lista de fallos
            if(!fallosAcumulados.includes(q)) fallosAcumulados.push(q);
            
            buttons.forEach(b => {
                if(b.innerText.startsWith(correcta + ")")) b.classList.add('correcta');
            });
        }
        document.getElementById('btn-next').classList.remove('hidden');
    }

    function siguiente() {
        indice++;
        if(indice < preguntasSesion.length) mostrar();
        else finalizar();
    }

    function finalizar() {
        document.getElementById('pantalla-test').classList.add('hidden');
        const final = document.getElementById('pantalla-final');
        final.classList.remove('hidden');
        
        document.getElementById('nota').innerText = aciertos + " / " + preguntasSesion.length;
        const texto = document.getElementById('texto-final');
        const apto = (aciertos / preguntasSesion.length) >= 0.8;
        texto.innerText = apto ? "¡APTO!" : "NO APTO";
        texto.style.color = apto ? "green" : "red";

        // Configurar botón de ver fallos
        const btnVer = document.getElementById('btn-ver-fallos');
        const lista = document.getElementById('lista-fallos');
        lista.innerHTML = "";
        lista.classList.add('hidden');

        // Solo mostrar si hay fallos en esta sesión
        let fallosSession = preguntasSesion.filter(q => fallosAcumulados.includes(q));
        
        if(fallosAcumulados.length > 0) {
            btnVer.classList.remove('hidden');
            document.getElementById('count-fallos').innerText = fallosAcumulados.length;
            
            fallosAcumulados.forEach(f => {
                const item = document.createElement('div');
                item.className = 'fallo-item';
                item.innerHTML = `<strong>P:</strong> ${f.p}<br><span style="color:green"><strong>R:</strong> ${f.r}) ${f[f.r.toLowerCase()]}</span>`;
                lista.appendChild(item);
            });
        } else {
            btnVer.classList.add('hidden');
        }
    }

    function toggleFallos() {
        const lista = document.getElementById('lista-fallos');
        lista.classList.toggle('hidden');
    }

    function volverMenu() {
        document.getElementById('pantalla-final').classList.add('hidden');
        document.getElementById('pantalla-carga').classList.remove('hidden');
        generarMenu();
    }
</script>
</body>
</html>
